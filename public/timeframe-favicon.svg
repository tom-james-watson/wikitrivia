<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Timeframe</title>
  <style>
    :root { color: #000000; }
    @media (prefers-color-scheme: dark) {
      :root { color: #ffffff; }
    }
  </style>
  <!--
    The scoring curve, which is the one thing on screen that belongs to this
    game and nothing else: a normal distribution over the years, drawn under the
    dial when an answer lands.

    Sampled from the function rather than drawn with beziers by eye, and then
    shifted so that it reaches its baseline exactly at both edges — a Gaussian
    only approaches zero, so left alone the tails are cut off part way up and
    the mark reads as a tent with its sides sliced off. Shallow for the same
    reason: the taller it is the more it looks like a triangle and the less like
    a distribution.
  -->
